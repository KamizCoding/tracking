services:
  - type: web
    name: vellix-tracking
    env: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: vellix-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vellix-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: vellix-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: vellix-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vellix-db
          property: password
      - key: TRACKING_DOMAIN
        value: vellix-tracking.onrender.com

databases:
  - name: vellix-db
    databaseName: vellix_tracking
    user: vellix_user
    plan: free
